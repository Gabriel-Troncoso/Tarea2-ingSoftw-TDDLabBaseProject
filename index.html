<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Saludador</title>
  </head>
  <body>
    <h1>Sistema de Saludos</h1>

    <form id="saludo-form">
     
      <div>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" />
      </div>

      
      <div>
        <label for="edad">Edad:</label>
        <input type="number" id="edad" />
      </div>

      <div>
        <label for="genero">Género:</label>
        <select id="genero">
          <option value="masculino">Masculino</option>
          <option value="femenino">Femenino</option>
          <option value="otro">Otro</option>
        </select>
      </div>
      <div>
        <label for="idioma">Idioma:</label>
        <select id="idioma">
          <option value="es">Español</option>
          <option value="en">Inglés</option>
        </select>
      </div>

      <br>
      <input type="submit" value="Saludar" id="saludar-button" />
    </form>

    <!-- Div donde aparecerá el resultado del saludo -->
    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
